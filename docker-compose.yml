services:
  wiki:
    image: node:22-alpine
    container_name: docker-panel-wiki
    restart: unless-stopped
    working_dir: /wiki
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm docs:dev --host 0.0.0.0"
    ports:
      - "888:888"
    volumes:
      - ./:/wiki
      - wiki_node_modules:/wiki/node_modules

volumes:
  wiki_node_modules:
